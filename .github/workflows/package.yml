name: Package

# Builds the release packages on all three platforms and smoke-tests each one on a fresh
# runner that has no Qt or compiler installed (docs/BUILDING.md §8): the package must bring
# everything it needs. Called by release.yml for tagged releases.

on:
  push:
    branches: [main, 'phase-*', 'dev/**']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

env:
  QT_VERSION: "6.8.3"

jobs:
  package:
    name: Package / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            qt_arch: win64_msvc2022_64
          - os: ubuntu-22.04 # oldest supported glibc: the AppImage runs on 22.04 and later
            qt_arch: linux_gcc_64
          - os: macos-14
            qt_arch: clang_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Set up MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-13 \
            libgl1-mesa-dev libegl1 libxkbcommon-dev libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 libxcb-cursor0 file
          echo "CC=gcc-13" >> "$GITHUB_ENV"
          echo "CXX=g++-13" >> "$GITHUB_ENV"

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt_arch }}
          modules: qtpdf
          cache: true

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --preset package 2>&1 | tee build.log
          cmake --build --preset package 2>&1 | tee -a build.log

      - name: Package (CPack)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          cd build/package
          cpack 2>&1 | tee cpack.log

      # Linux: linuxdeploy with its Qt plugin deploys Qt's libraries, plugins and qt.conf
      # into an AppDir; the AppImage and the .tar.gz are made from that same AppDir.
      - name: AppImage and archive (linuxdeploy)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cmake --install build/package --prefix "$PWD/AppDir/usr" 2>&1 | tee -a build.log
          base=https://github.com/linuxdeploy
          curl -fsSL -o linuxdeploy "$base/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          curl -fsSL -o linuxdeploy-plugin-qt "$base/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          export EXTRA_QT_MODULES="pdf;svg;printsupport"
          export EXTRA_PLATFORM_PLUGINS="libqoffscreen.so"
          version=$(grep -oP 'CPACK_PACKAGE_VERSION "\K[^"]+' build/package/CPackConfig.cmake)
          # The C++ runtime stays in lib/studyboard-cxxrt (the launcher decides whether it is
          # used): linuxdeploy must not copy the build machine's newer one into lib/.
          LINUXDEPLOY_OUTPUT_VERSION="$version" ./linuxdeploy --appdir AppDir --plugin qt \
            --desktop-file AppDir/usr/share/applications/studyboard.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/studyboard.png \
            --custom-apprun AppDir/usr/bin/studyboard \
            --exclude-library 'libstdc++.so*' --exclude-library 'libgcc_s.so*' \
            --output appimage 2>&1 | tee -a build.log
          tools/check_linux_appdir.sh AppDir 2>&1 | tee -a build.log
          name="StudyBoard-$version-linux-x86_64"
          mv StudyBoard*.AppImage "build/package/$name.AppImage"
          mkdir -p "archive/$name" && cp -a AppDir/usr/. "archive/$name/"
          tar -czf "build/package/$name.tar.gz" -C archive "$name"
          (cd build/package && sha256sum "$name.AppImage" > "$name.AppImage.sha256" \
            && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")

      - name: Report errors as annotations
        if: failure()
        shell: bash
        run: |
          cat build.log build/package/cpack.log 2>/dev/null \
            | grep -E -A3 "error:|FAILED:|CMake Error|CPack Error|^AppDir: " \
            | head -60 | sed -e 's/%/%25/g' -e 's/^/::error::/' || true

      # Public record of what was built (job logs and artifacts need sign-in; annotations
      # do not): file, size and SHA-256 of every package (docs/RELEASE.md).
      - name: Record the packages as notices
        shell: bash
        run: |
          for f in build/package/StudyBoard-*; do
            case "$f" in *.sha256) continue ;; esac
            [ -f "$f" ] || continue
            sum=$( (sha256sum "$f" 2>/dev/null || shasum -a 256 "$f") | cut -d' ' -f1)
            echo "::notice::package $(basename "$f") $(wc -c < "$f" | tr -d ' ') bytes sha256 $sum"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ runner.os }}
          if-no-files-found: error
          path: |
            build/package/StudyBoard-*.zip
            build/package/StudyBoard-*.exe
            build/package/StudyBoard-*.dmg
            build/package/StudyBoard-*.tar.gz
            build/package/StudyBoard-*.AppImage
            build/package/StudyBoard-*.sha256

  # Fresh runners: no Qt, no compiler setup. Each package must run from what it contains.
  smoke:
    name: Smoke test / ${{ matrix.os }}
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact: packages-Windows
          - os: ubuntu-22.04
            artifact: packages-Linux
          - os: ubuntu-24.04
            artifact: packages-Linux
          - os: macos-14
            artifact: packages-macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: packages

      - name: Windows — installer, self-test, portable ZIP, uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem packages -Filter 'StudyBoard-*.exe' | Select-Object -First 1
          $dir = 'C:\StudyBoardTest'
          Start-Process -Wait -FilePath $installer.FullName -ArgumentList '/S', "/D=$dir"
          # No GPU on the runner (Qt's software OpenGL is 3.0): OpenGL is reported, not
          # required. Windows OpenGL rendering is covered by the real-GPU tests.
          $out = & "$dir\bin\studyapp.exe" --self-test --no-opengl-check | Out-String
          Write-Output $out
          if ($LASTEXITCODE -ne 0) { throw "self-test of the installed copy failed" }
          Expand-Archive (Get-ChildItem packages -Filter 'StudyBoard-*.zip').FullName -DestinationPath zip
          $exe = Get-ChildItem zip -Recurse -Filter studyapp.exe | Select-Object -First 1
          $out = & $exe.FullName --self-test --no-opengl-check | Out-String
          Write-Output $out
          if ($LASTEXITCODE -ne 0) { throw "self-test of the ZIP failed" }
          if ($out -notmatch 'OpenGL 3\.3 core rendering') { throw "no OpenGL check ran" }
          $expected = ($installer.Name -replace '^StudyBoard-([^-]+)-.*$', '$1')
          # A GUI program may show --version in a message box; print it instead, and never wait
          # on a window.
          $env:QT_COMMAND_LINE_PARSER_NO_GUI_MESSAGE_BOXES = '1'
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '--version' -NoNewWindow `
            -RedirectStandardOutput version.txt -PassThru
          if (-not $p.WaitForExit(30000)) { $p.Kill(); throw "--version did not return" }
          $version = (Get-Content version.txt -Raw).Trim()
          Write-Output "::notice::version reported: $version (package $expected)"
          if ($version -ne "StudyBoard $expected") { throw "version mismatch: $version" }
          $out -split "`n" | Select-String 'OpenGL|self-test' | ForEach-Object { "::notice::$($_.Line.Trim())" }
          Start-Process -Wait -FilePath "$dir\Uninstall.exe" -ArgumentList '/S'
          Start-Sleep -Seconds 5 # the uninstaller copies itself and finishes asynchronously
          if (Test-Path "$dir\bin\studyapp.exe") { throw "uninstall left the application behind" }

      - name: Linux — AppImage and archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # A desktop system has these; the runner image does not.
          sudo apt-get update
          # Mesa (llvmpipe under Xvfb) is the OpenGL driver the self-test renders with.
          sudo apt-get install -y --no-install-recommends xvfb libegl1 libgl1 libopengl0 \
            libgl1-mesa-dri libglx-mesa0 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libfontconfig1 fonts-dejavu-core
          chmod +x packages/*.AppImage
          # Extracted into a directory whose name has a space.
          mkdir "tgz dir" && tar -xzf packages/StudyBoard-*.tar.gz -C "tgz dir"
          launcher="$(find "tgz dir" -path '*/bin/studyboard' | head -1)"
          # For the log: the launcher uses the bundled libstdc++ only if the system's is older.
          system=$(ldconfig -p | sed -n 's/^[[:space:]]*libstdc++\.so\.6 (.*x86-64.*) => //p' | head -1)
          newest=$(grep -aoE 'GLIBCXX_3\.4\.[0-9]+' "$system" | sort -V | tail -1)
          echo "system libstdc++: $system, up to $newest" | tee smoke.log
          { ldd "$(dirname "$launcher")/studyapp" | grep 'not found' || true; } 2>&1 | tee -a smoke.log
          # Through the launcher, as users start it; the self-test includes OpenGL rendering.
          STUDYBOARD_LAUNCHER_DEBUG=1 xvfb-run -a "$launcher" --self-test 2>&1 | tee -a smoke.log
          grep -q '^ok: OpenGL 3.3 core rendering' smoke.log
          # Ubuntu 22.04's libstdc++ lacks what the application needs, 24.04's has it.
          case "${{ matrix.os }}" in
            ubuntu-22.04) expected=bundled ;;
            *) expected=system ;;
          esac
          grep -q "C++ runtime: $expected " smoke.log \
            || { echo "expected the $expected C++ runtime" | tee -a smoke.log; exit 1; }
          STUDYBOARD_LAUNCHER_DEBUG=1 APPIMAGE_EXTRACT_AND_RUN=1 \
            xvfb-run -a packages/StudyBoard-*.AppImage --self-test 2>&1 | tee -a smoke.log
          # The launcher passes the application's exit status on (an unknown option: 1).
          status=0
          xvfb-run -a "$launcher" --no-such-option > /dev/null 2>&1 || status=$?
          echo "exit status for an unknown option: $status" | tee -a smoke.log
          test "$status" -eq 1
          expected=$(basename packages/StudyBoard-*.tar.gz | sed -E 's/^StudyBoard-([^-]+)-.*$/\1/')
          version=$(xvfb-run -a "$launcher" --version 2>/dev/null | tail -1)
          echo "version reported: $version (package $expected)" | tee -a smoke.log
          test "$version" = "StudyBoard $expected"

      - name: macOS — DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          hdiutil attach packages/StudyBoard-*.dmg -mountpoint /Volumes/StudyBoard -nobrowse
          /Volumes/StudyBoard/studyapp.app/Contents/MacOS/studyapp --self-test 2>&1 | tee smoke.log
          expected=$(basename packages/StudyBoard-*.dmg | sed -E 's/^StudyBoard-([^-]+)-.*$/\1/')
          version=$(/Volumes/StudyBoard/studyapp.app/Contents/MacOS/studyapp --version 2>/dev/null | tail -1)
          echo "version reported: $version (package $expected)" | tee -a smoke.log
          hdiutil detach /Volumes/StudyBoard
          test "$version" = "StudyBoard $expected"
          grep -q '^ok: OpenGL 3.3 core rendering' smoke.log

      # Job logs require sign-in; annotations are public.
      - name: Report the smoke-test output as annotations
        if: failure() && runner.os != 'Windows'
        shell: bash
        run: tail -n 40 smoke.log | sed -e 's/%/%25/g' -e 's/^/::error::/' || true

      # Also on success: the launcher's runtime choice and the OpenGL driver, as evidence.
      - name: Report the runtime and OpenGL lines as notices
        if: success() && runner.os != 'Windows'
        shell: bash
        run: |
          grep -E 'libstdc\+\+|C\+\+ runtime|OpenGL|exit status|self-test|version reported' smoke.log \
            | sed -e 's/%/%25/g' -e 's/^/::notice::/' || true
